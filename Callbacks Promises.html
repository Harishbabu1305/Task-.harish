<!DOCTYPE html>
<html>
<head>
  <title>Callback and Promise Example</title>
</head>
<body>
  <h2>Callback and Promise Demo</h2>
  <div id="output"></div>

  <script>
    const output = document.getElementById("output");
      function greetUser(name, callback) {
      output.innerHTML += `Hello, ${name}!<br>`;
      callback(); 
    }
      greetUser("Harish", () => {
      output.innerHTML += "This message comes from the callback!<br><br>";
    });
      function checkMarks(marks) {
      return new Promise((resolve, reject) => {
        if (marks >= 50) {
          resolve("🎉 You passed the exam!");
        } else {
          reject("❌ You failed. Try again!");
        }
      });
    }
    const studentMarks = 75; 

    checkMarks(studentMarks)
      .then((message) => {
        output.innerHTML += `<strong>Promise Resolved:</strong> ${message}<br>`;
      })
      .catch((error) => {
        output.innerHTML += `<strong>Promise Rejected:</strong> ${error}<br>`;
      });
  </script>
</body>
</html>
