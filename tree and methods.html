<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f2f2f2;
      padding: 40px;
    }

    h1 {
      color: #333;
    }

    p {
      color: #444;
      font-size: 18px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1 id="heading">Welcome to My Webpage</h1>
  <p id="paragraph"> Click the buttons to see </p>

  <button onclick="changeText()">Change Heading Text</button>
  <button onclick="changeStyle()">Change Heading Style</button>
  <button onclick="changeParagraph()">Change Paragraph Content</button>
  <button onclick="changeColorFont()">Change Color & Font Size</button>

  <script>

    function changeText() {
      document.getElementById("heading").innerText = "Text Changed Using getElementById";
    }

    function changeStyle() {
      const heading = document.getElementById("heading");
      heading.style.backgroundColor = "#ffcc00";
      heading.style.padding = "10px";
      heading.style.borderRadius = "8px";
    }

    function changeParagraph() {
      document.getElementById("paragraph").innerHTML = "This paragraph content has been <b>updated</b> using JavaScript!";
    }

    function changeColorFont() {
      const para = document.getElementById("paragraph");
      para.style.color = "blue";
      para.style.fontSize = "22px";
      para.style.fontStyle = "italic";
    }
  </script>

</body>
</html>
