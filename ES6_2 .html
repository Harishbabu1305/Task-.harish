<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destructuring, Spread </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5faff;
      padding: 20px;
    }
    h1 {
      color: #004a7c;
    }
    .output {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #0078d7;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>

  <h1>Destructuring, Spread & Rest Operators Example</h1>

  <h2>Extract Values using Destructuring</h2>
  <p id="arrayDestructuring" class="output"></p>
  <p id="objectDestructuring" class="output"></p>

  <h2>Copy Array using Spread Operator</h2>
  <p id="spreadOutput" class="output"></p>

  <h2>Function using Rest Operator</h2>
  <p id="restOutput" class="output"></p>
  <button id="sumBtn">Show Sum using Rest Operator</button>

  <script>
    
    const colors = ["Red", "Green", "Blue"];
    const [first, second, third] = colors;
    document.getElementById("arrayDestructuring").textContent =
      `Colors → First: ${first}, Second: ${second}, Third: ${third}`;

    const car = { brand: "Tesla", model: "Model 3", year: 2024 };
    const { brand, model, year } = car;
    document.getElementById("objectDestructuring").textContent =
      `Car → Brand: ${brand}, Model: ${model}, Year: ${year}`;

    const originalArray = [10, 20, 30];
    const copiedArray = [...originalArray]; 
    copiedArray.push(40); 
    document.getElementById("spreadOutput").textContent =
      `Original Array: [${originalArray}] | Copied Array (with 40 added): [${copiedArray}]`;

    function sumNumbers(...numbers) {
      return numbers.reduce((total, num) => total + num, 0);
    }

    const sumBtn = document.getElementById("sumBtn");
    sumBtn.addEventListener("click", () => {
      const total = sumNumbers(5, 10, 15, 20);
      document.getElementById("restOutput").textContent =
        `Sum of (5, 10, 15, 20) = ${total}`;
    });
  </script>

</body>
</html>
